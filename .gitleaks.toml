# Gitleaks configuration. Extends the default rule set with checks for the
# kinds of instance-specific values that have leaked from lab exports before.

title = "cloudbolt-as-code"

[extend]
useDefault = true

[[rules]]
id = "cloudbolt-lab-identifiers"
description = "Internal CloudBolt lab hostnames, domains, and resource names"
regex = '''(?i)(cblabsales|\bmb-dev\b|\bse-demo\b)'''
keywords = ["cblabsales", "mb-dev", "se-demo"]

[[rules]]
id = "azure-subscription-resource-id"
description = "Azure resource ID containing a real subscription GUID (use <subscription-id>)"
regex = '''/subscriptions/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}'''
keywords = ["/subscriptions/"]

[[rules]]
id = "hcp-terraform-object-id"
description = "HCP Terraform workspace, run, module, or team ID from a real organization"
regex = '''\b(ws|run|nocode|mod|cv|team|org)-[A-Za-z0-9]{16}\b'''
keywords = ["ws-", "run-", "nocode-", "mod-", "cv-", "team-", "org-"]

[allowlist]
description = "Placeholders, the nil GUID, this configuration, and the lint that carries the same patterns"
regexes = [
  '''FILL-ME''',
  '''<[a-z][a-z-]*>''',
  '''^[a-z]+-x{16}$''',
  '''00000000-0000-0000-0000-000000000000''',
]
paths = ['''^\.gitleaks\.toml$''', '''^tools/validate_metadata\.py$''']
