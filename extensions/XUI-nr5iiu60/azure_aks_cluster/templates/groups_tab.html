{% load i18n %}
{% include "azure_aks_cluster/templates/_assets.html" %}

<div id="aksx-groups" class="aksx">
  <div class="aks-card">
    <div class="aks-hero-top">
      <div>
        <div class="aks-eyebrow">{% trans "Groups" %}</div>
        <div class="aks-title"><i class="bi bi-people-fill" aria-hidden="true"></i> {{ cluster_name }}</div>
        <div class="aks-sub">{% trans "CloudBolt groups that may order namespaces on this cluster" %}</div>
      </div>
      <div class="aks-tools">
        {% if add_url %}
        <a class="btn btn-sm btn-primary open-dialog" href="{{ add_url }}">
          <i class="bi bi-person-plus" aria-hidden="true"></i> {% trans "Add groups" %}
        </a>
        {% endif %}
        <button type="button" class="btn btn-sm btn-outline-secondary" data-aks-refresh title="{% trans 'Read the groups again' %}">
          <i class="bi bi-arrow-clockwise" aria-hidden="true"></i> {% trans "Reload" %}
        </button>
      </div>
    </div>
  </div>

  {# ── Entitled groups: the panel renders its own card ── #}
  <div data-aks-panel="groups" data-aks-src="{{ groups_url }}" data-aks-loading="CloudBolt"></div>
</div>

<script>
  $(function () { window.aksxInit("aksx-groups"); });
</script>
