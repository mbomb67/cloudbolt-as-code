{% comment %}
  Styles for the Agent Activity page. Same visual language as the Runbooks and
  Content Packages extensions: tokens derive from --bs-primary /
  --bs-body-color / --surface / --neutral-* so Branded Themes re-theme the page.
{% endcomment %}
<style>
  .mcpaa {
    position: relative;
    --aa-muted: color-mix(in srgb, var(--bs-body-color, #212529) 58%, transparent);
    --aa-soft: color-mix(in srgb, var(--bs-body-color, #212529) 78%, transparent);
    --aa-line: var(--neutral-250, #E2E8ED);
    --aa-surface-2: color-mix(in srgb, var(--bs-body-color, #212529) 4%, var(--surface, #fff));
    --aa-primary: var(--bs-primary, #0d6efd);
    --aa-ok: var(--bs-success, #198754);
    --aa-warn: var(--bs-warning, #ffc107);
    --aa-warn-text: color-mix(in srgb, var(--bs-warning, #ffc107) 55%, var(--bs-body-color, #212529));
    --aa-bad: var(--bs-danger, #dc3545);
  }
  .mcpaa .aa-card { background: var(--surface, #fff); border: 1px solid var(--aa-line); border-radius: 12px; margin-bottom: 16px; overflow: hidden; }
  .mcpaa .aa-hero { display: flex; gap: 18px; align-items: flex-start; padding: 18px 22px; flex-wrap: wrap; }
  .mcpaa .aa-eyebrow { font-size: 11.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--aa-muted); }
  .mcpaa .aa-title { display: inline-flex; align-items: center; gap: 8px; font-size: 17px; font-weight: 700; margin-top: 2px; overflow-wrap: anywhere; }
  .mcpaa .aa-title .bi { color: var(--aa-primary); }
  .mcpaa .aa-sub { font-size: 12.5px; font-weight: 600; color: var(--aa-muted); margin-top: 2px; }
  .mcpaa .aa-card-h { display: flex; align-items: center; gap: 12px; padding: 12px 18px; border-bottom: 1px solid var(--aa-line); flex-wrap: wrap; }
  .mcpaa .aa-card-t { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--aa-muted); }
  .mcpaa .aa-card-tools { margin-left: auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .mcpaa .aa-card-b { padding: 16px 18px; }
  .mcpaa .aa-filters { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px 16px; }
  .mcpaa .aa-filters label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; color: var(--aa-muted); margin-bottom: 3px; display: block; }
  .mcpaa .aa-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 14px; }
  .mcpaa .aa-table { width: 100%; font-size: 13px; border-collapse: collapse; margin: 0; }
  .mcpaa .aa-table th { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; color: var(--aa-muted); padding: 10px 14px; border-bottom: 1px solid var(--aa-line); text-align: left; white-space: nowrap; }
  .mcpaa .aa-table td { padding: 9px 14px; border-bottom: 1px solid color-mix(in srgb, var(--bs-body-color, #212529) 8%, transparent); vertical-align: top; font-weight: 600; }
  .mcpaa .aa-table td.aa-num { text-align: right; font-variant-numeric: tabular-nums; }
  .mcpaa .aa-table th.aa-num { text-align: right; }
  .mcpaa .aa-table tbody tr:last-child td { border-bottom: 0; }
  .mcpaa .aa-table tbody tr:hover td { background: var(--aa-surface-2); }
  .mcpaa .aa-pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 999px; white-space: nowrap; background: color-mix(in srgb, var(--bs-body-color, #212529) 7%, transparent); color: var(--aa-soft); }
  .mcpaa .aa-pill-ok { background: color-mix(in srgb, var(--aa-ok) 14%, transparent); color: var(--aa-ok); }
  .mcpaa .aa-pill-warn { background: color-mix(in srgb, var(--aa-warn) 22%, transparent); color: var(--aa-warn-text); }
  .mcpaa .aa-pill-bad { background: color-mix(in srgb, var(--aa-bad) 12%, transparent); color: var(--aa-bad); }
  .mcpaa .aa-pill-live { background: color-mix(in srgb, var(--aa-primary) 13%, transparent); color: var(--aa-primary); }
  .mcpaa .aa-tag { display: inline-block; font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; padding: 2px 7px; border-radius: 999px; background: color-mix(in srgb, var(--bs-body-color, #212529) 7%, transparent); color: var(--aa-soft); white-space: nowrap; margin: 0 3px 3px 0; }
  .mcpaa .aa-muted { color: var(--aa-muted); font-weight: 600; }
  .mcpaa .aa-hint { font-size: 11.5px; color: var(--aa-muted); font-weight: 600; margin-top: 3px; }
  .mcpaa .aa-mono { font-family: SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; }
  .mcpaa .aa-empty { color: var(--aa-muted); font-weight: 600; font-size: 12.5px; text-align: center; padding: 18px; }
  .mcpaa .aa-alert { display: flex; gap: 10px; align-items: flex-start; padding: 12px 22px; font-size: 13px; font-weight: 600; color: var(--aa-bad); overflow-wrap: anywhere; }
  .mcpaa .aa-alert .bi { flex: 0 0 auto; margin-top: 2px; }
  .mcpaa .aa-notice { display: flex; gap: 10px; align-items: flex-start; padding: 10px 18px; font-size: 12.5px; font-weight: 600; color: var(--aa-warn-text); background: color-mix(in srgb, var(--aa-warn) 10%, transparent); border-bottom: 1px solid var(--aa-line); }
  .mcpaa .aa-meta { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 1px; background: var(--aa-line); border-top: 1px solid var(--aa-line); }
  .mcpaa .aa-meta > div { background: var(--surface, #fff); padding: 10px 18px; }
  .mcpaa .aa-meta .v { font-size: 13.5px; font-weight: 700; margin-top: 2px; overflow-wrap: anywhere; }
  .mcpaa .aa-tabs { display: flex; gap: 4px; padding: 0 12px; border-bottom: 1px solid var(--aa-line); flex-wrap: wrap; }
  .mcpaa .aa-tabs button { display: inline-flex; align-items: center; gap: 7px; padding: 10px 12px; font-size: 13px; font-weight: 700; background: none; border: 0; border-bottom: 2px solid transparent; margin-bottom: -1px; color: color-mix(in srgb, var(--bs-body-color, #212529) 62%, transparent); }
  .mcpaa .aa-tabs button:hover { color: var(--bs-body-color, #212529); }
  .mcpaa .aa-tabs button.active { color: var(--aa-primary); border-bottom-color: var(--aa-primary); }
  .mcpaa .aa-tabs .aa-count { font-size: 11px; padding: 1px 7px; border-radius: 999px; background: color-mix(in srgb, var(--bs-body-color, #212529) 7%, transparent); }
  .mcpaa .aa-pager { display: flex; align-items: center; justify-content: flex-end; gap: 8px; padding: 10px 18px; border-top: 1px solid var(--aa-line); font-size: 12.5px; font-weight: 600; color: var(--aa-muted); }
  .mcpaa .aa-busy { opacity: .55; pointer-events: none; }
  .mcpaa details.aa-raw summary { cursor: pointer; color: var(--aa-muted); font-size: 12px; }
  .mcpaa details.aa-raw pre { white-space: pre-wrap; overflow-wrap: anywhere; margin: 6px 0 0; font-size: 12px; }
  .mcpaa .aa-spin { display: inline-block; animation: aa-spin 1s linear infinite; }
  @keyframes aa-spin { to { transform: rotate(360deg); } }
</style>
