<div class="sfx-set-t" style="margin-top:10px">Annotation Examples</div>
<div class="sfx-set-d">To learn about using annotations to configure optimization settings, see the <a href="https://docs.stormforge.io/docs/configure/settings/" target="_blank" rel="noopener">product docs</a>.</div>
<div class="sfx-code">
  <pre class="sfx-pre sfx-mono" id="sfx-ann-{{ resource.id }}-{{ key }}">{{ text }}</pre>
  <button type="button" class="btn btn-sm btn-outline-secondary" data-sfx-copy="sfx-ann-{{ resource.id }}-{{ key }}" aria-label="Copy annotations"><i class="bi bi-clipboard"></i></button>
</div>
