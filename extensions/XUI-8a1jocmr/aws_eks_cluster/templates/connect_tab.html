{% load i18n %}
{% include "aws_eks_cluster/templates/_assets.html" %}

<div id="eksx-connect" class="eksx">
  <div class="eks-card">
    <div class="eks-hero-top">
      <div>
        <div class="eks-eyebrow">{% trans "Connect to namespace" %}</div>
        <div class="eks-title"><i class="bi bi-terminal" aria-hidden="true"></i> {{ namespace }}</div>
        <div class="eks-sub">{% if cluster_name %}{% trans "On EKS cluster" %} {{ cluster_name }}{% endif %}</div>
      </div>
      <div class="eks-tools">
        {% if manage_access_url %}
        <a class="btn btn-sm btn-primary open-dialog" href="{{ manage_access_url }}" title="{% trans 'Grant or revoke kubectl access for an IAM role or user' %}">
          <i class="bi bi-people" aria-hidden="true"></i> {% trans "Manage access" %}
        </a>
        {% endif %}
        <button type="button" class="btn btn-sm btn-outline-secondary" data-eks-refresh>
          <i class="bi bi-arrow-clockwise" aria-hidden="true"></i> {% trans "Refresh" %}
        </button>
      </div>
    </div>
  </div>

  <div data-eks-panel="connect" data-eks-src="{{ connect_url }}" data-eks-loading="AWS"></div>
</div>

<script>
  $(function () { window.eksxInit("eksx-connect"); });
</script>
