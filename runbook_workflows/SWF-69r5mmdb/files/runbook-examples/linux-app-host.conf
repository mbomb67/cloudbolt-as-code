# Settings for the Prepare Linux app host Runbooks workflow
# (runbook_workflows/SWF-69r5mmdb). Every step of the workflow attaches this
# file from File Archives, as runbook-examples/linux-app-host.conf, and reads
# its settings from it. Upload a changed copy under the same name and the next
# run uses the new version.
#
# KEY=value lines; a value may be in double quotes. Values are read as text,
# never run.

# Check Linux App Host
MIN_FREE_GB=2
MIN_MEMORY_MB=900
DATA_MOUNT=/
REQUIRED_COMMANDS="tar gzip systemctl systemd-tmpfiles"

# Create Linux App Account
APP_NAME=demoapp
APP_USER=demoapp
APP_GROUP=demoapp
APP_HOME=/opt/demoapp

# Configure Linux App Host
LOG_RETENTION_DAYS=14
ENVIRONMENT=Development
OWNER_TEAM="Platform Engineering"
